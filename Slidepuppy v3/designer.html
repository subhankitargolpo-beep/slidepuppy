            // --- AI Functionality ---
            showLoader() { this.loader.style.display = 'flex'; }
            hideLoader() { this.loader.style.display = 'none'; }

            handleAIGenerate() {
                const applyToAll = document.getElementById('ai-apply-all-checkbox').checked;
                if (applyToAll) {
                    this.editPresentationWithAI();
                } else {
                    this.generateOrEditSingleSlide();
                }
            }
            
            async generateOrEditSingleSlide() {
                const prompt = document.getElementById('ai-prompt')?.value;
                const modifyContent = document.getElementById('ai-modify-content-checkbox').checked;

                if (!prompt || !this.geminiApiKey) {
                    this.showNotification('error', 'Please enter a prompt and ensure API key is set.');
                    return;
                }
                this.showLoader();
                this.showNotification('info', 'AI is working...');

                const existingImage = this.canvas.getObjects().find(obj => obj.isType('image'));
                if (existingImage) {
                    this.canvas.remove(existingImage);
                }

                const currentObjects = this.canvas.toJSON(['type', 'text', 'fontFamily', 'isFooter']);
                
                let contentRule = "The user wants a new slide. Create a new layout and generate new text content based on the user's prompt.";
                if (this.canvas.getObjects().length > 0) {
                    contentRule = modifyContent
                        ? "The user wants to edit this slide. You can modify the existing layout and text content, or replace it entirely to fulfill the request."
                        : "IMPORTANT: You MUST NOT change any existing text. Only modify the layout, colors, and non-text elements to fulfill the user's request.";
                }

                const fullPrompt = `You are a slide layout designer. The canvas is 800x450.
                ${contentRule}
                User's prompt: "${prompt}".
                
                Here is the current slide's JSON (it's empty if this is a new slide): ${JSON.stringify(currentObjects.objects.filter(o => !o.isFooter && o.type !== 'image'))}

                Return ONLY a valid JSON object with two optional keys: "backgroundColor" (a hex color string) and "objects" (an array of fabric.js objects).
                - Your response MUST be a single, valid JSON object. Do not include any comments (like //) or extra text outside the JSON structure.
                - For multi-line text (like bullet points), you MUST use the escaped newline character "\\n" within the JSON string value. For example: "text": "Line 1\\nLine 2".
                - Use 'textbox' for text elements.
                - Use 'Fredoka One' for titles/headings and 'Outfit' for all other text.`;

                try {
                    const response = await this.callGeminiAPI(fullPrompt);
                    const aiResponse = this.parseJsonResponse(response);
                    
                    this.canvas.clear();

                    if (aiResponse.backgroundColor) {
                        this.canvas.setBackgroundColor(aiResponse.backgroundColor, this.canvas.renderAll.bind(this.canvas));
                    } else {
                        const currentState = this.slides[this.currentSlideIndex].canvasState ? JSON.parse(this.slides[this.currentSlideIndex].canvasState) : {};
                        this.canvas.backgroundColor = currentState.backgroundColor || this.themeColors.surface;
                    }

                    if (aiResponse.objects) {
                        this.sanitizeAIObjects(aiResponse.objects);
                        const objects = await this.createFabricObjects(aiResponse.objects);
                        objects.forEach(obj => {
                            if(obj) this.canvas.add(obj);
                        });
                    }
                    
                    if (existingImage) {
                        this.canvas.add(existingImage);
                    }

                    this.addOrUpdateFooterObject();
                    this.canvas.renderAll();
                    this.saveState();
                    this.showNotification('success', 'AI task completed!');

                } catch (error) {
                    this.showNotification('error', `AI task failed: ${error.message}`);
                } finally {
                    this.hideLoader();
                }
            }

            async ensureAllSlidesAreRendered() {
                const tempCanvas = new fabric.Canvas(null, {width: 800, height: 450});
                for (let i = 0; i < this.slides.length; i++) {
                    if (!this.slides[i].canvasState) {
                        tempCanvas.clear();
                        this.createInitialSlideContentOnCanvas(this.slides[i], tempCanvas);
                        this.slides[i].canvasState = JSON.stringify(tempCanvas.toJSON(['backgroundColor']));
                    }
                }
            }
            
            createInitialSlideContentOnCanvas(slide, canvas) {
                canvas.backgroundColor = this.themeColors.surface;
                let yPosition = 40;
                if (slide.title) {
                    const titleObj = new fabric.Textbox(slide.title, {
                        top: yPosition, fontSize: 40, fontWeight: 'normal', fontFamily: 'Fredoka One',
                        fill: this.themeColors.primary, width: 720, textAlign: 'center'
                    });
                    canvas.add(titleObj).centerObjectH(titleObj);
                    yPosition += titleObj.getScaledHeight() + 30;
                }

                if (slide.content && slide.content.length > 0) {
                    const contentText = slide.content.map(item => `• ${item.text || item}`).join('\n');
                     const textObj = new fabric.Textbox(contentText, {
                        top: yPosition, left: 40, fontSize: 22, width: 720,
                        fontFamily: 'Outfit', fill: this.themeColors.text
                    });
                    canvas.add(textObj);
                }
            }

            async editPresentationWithAI() {
                const prompt = document.getElementById('ai-prompt')?.value;
                const modifyContent = document.getElementById('ai-modify-content-checkbox').checked;

                if (!prompt || !this.geminiApiKey) {
                    this.showNotification('error', 'Please enter a global instruction.');
                    return;
                }

                this.showLoader();
                this.showNotification('info', `Applying AI edits to all ${this.slides.length} slides...`);
                await this.ensureAllSlidesAreRendered();

                for (let i = 0; i < this.slides.length; i++) {
                    const slideState = JSON.parse(this.slides[i].canvasState);
                    const existingImageObjectData = slideState.objects.find(obj => obj.type === 'image');

                    let contentRule = modifyContent
                        ? "You are free to modify text content to fit the user's request."
                        : "IMPORTANT: You MUST NOT change any existing text content. Only modify layout, colors, and non-text elements.";

                    const singleSlidePrompt = `You are a presentation theme designer applying a global change. The user's overall instruction for the whole presentation is: "${prompt}".
                    Now, apply this instruction to the following single slide.
                    ${contentRule}
                    Here is the slide's current JSON (excluding any images): ${JSON.stringify({...slideState, objects: slideState.objects.filter(obj => obj.type !== 'image')})}
                    Return ONLY a valid JSON object for this single slide with "backgroundColor" and "objects" keys. Do not include comments.`;

                    try {
                        const response = await this.callGeminiAPI(singleSlidePrompt);
                        const aiResponse = this.parseJsonResponse(response);
                        
                        this.sanitizeAIObjects(aiResponse.objects || []);

                        const newSlideState = {
                            backgroundColor: aiResponse.backgroundColor || slideState.backgroundColor,
                            objects: aiResponse.objects || slideState.objects.filter(obj => obj.type !== 'image')
                        };

                        if (existingImageObjectData) {
                            newSlideState.objects.push(existingImageObjectData);
                        }
                        
                        this.slides[i].canvasState = JSON.stringify(newSlideState);

                    } catch (error) {
                        console.error(`Error processing slide ${i + 1}:`, error);
                        this.showNotification('error', `Failed to process slide ${i + 1}.`);
                        this.hideLoader();
                        return;
                    }
                }

                await this.loadSlideToCanvas();
                this.hideLoader();
                this.showNotification('success', 'Global AI edits applied to all slides!');
            }

            async improveSlideWithAI() {
                if (!this.geminiApiKey || this.canvas.getObjects().length === 0) {
                    this.showNotification('error', 'Cannot improve an empty slide.');
                    return;
                }
                this.showLoader();
                this.showNotification('info', 'AI is improving the layout...');
                
                const currentObjects = this.canvas.toJSON(['type', 'text', 'fontSize', 'fontWeight', 'fontFamily', 'isFooter']);
                const prompt = `You are a presentation design expert. The canvas is 800x450. Here is a JSON object of a slide's elements: ${JSON.stringify(currentObjects.objects.filter(o => !o.isFooter))}
                Your task is to improve the layout for visual appeal and clarity by only adjusting layout properties ('left', 'top', 'width', 'height', 'textAlign', 'scaleX', 'scaleY'). Do NOT add, remove, or change the content (text, colors, font family) of the objects.
                Return ONLY a valid JSON array of the modified objects with their new layout properties.`;

                try {
                    const response = await this.callGeminiAPI(prompt);
                    const newLayout = this.parseJsonResponse(response);

                    if (Array.isArray(newLayout) && newLayout.length === this.canvas.getObjects().filter(o => !o.isFooter).length) {
                        this.canvas.getObjects().filter(o => !o.isFooter).forEach((obj, index) => {
                            if (newLayout[index]) obj.set(newLayout[index]);
                        });
                        this.canvas.renderAll();
                        this.saveState();
                        this.showNotification('success', 'Layout improved by AI!');
                    } else throw new Error("AI returned an invalid layout.");
                } catch (error) {
                    this.showNotification('error', `AI improvement failed: ${error.message}`);
                } finally {
                    this.hideLoader();
                }
            }
            
            async createFabricObjects(objects) {
                const objectPromises = [];
                
                for (const objData of objects) {
                    if (objData.type === 'image' && objData.src) {
                        objectPromises.push(new Promise((resolve) => {
                            fabric.Image.fromURL(objData.src, (img) => {
                                if (img) {
                                    img.set(objData);
                                    resolve(img);
                                } else {
                                    console.error('Failed to load image from URL:', objData.src);
                                    resolve(null);
                                }
                            }, { crossOrigin: 'anonymous' });
                        }));
                    }
                }
                
                const nonImageObjectsData = objects.filter(obj => obj.type !== 'image');
                const enlivenedObjects = await new Promise(resolve => fabric.util.enlivenObjects(nonImageObjectsData, resolve));

                const allObjects = await Promise.all(objectPromises);
                return allObjects.concat(enlivenedObjects).flat();
            }


            // --- History (Undo/Redo) Management ---
            saveState() {
                const state = JSON.stringify(this.canvas.toJSON(['backgroundColor']));
                if (this.historyIndex < 0 || state !== this.history[this.historyIndex]) {
                    this.history = this.history.slice(0, this.historyIndex + 1);
                    this.history.push(state);
                    this.historyIndex = this.history.length - 1;
                }
            }

            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    this.canvas.loadFromJSON(this.history[this.historyIndex], () => {
                        this.addOrUpdateFooterObject();
                        this.canvas.renderAll();
                    });
                }
            }

            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    this.canvas.loadFromJSON(this.history[this.historyIndex], () => {
                         this.addOrUpdateFooterObject();
                         this.canvas.renderAll();
                    });
                }
            }

            // --- Export & Save Functionality ---
            async exportToPPTX() {
                this.showNotification('info', 'Generating PPTX... Please wait.');
                this.saveCurrentSlideState();
                await this.ensureAllSlidesAreRendered();
                const pptx = new PptxGenJS();
                pptx.layout = 'LAYOUT_16x9';

                const PxToInX = (val) => (val / 800) * 10;
                const PxToInY = (val) => (val / 450) * 5.625;
                const PxToPt = (val) => val * (72 / 96); 

                for (const slideData of this.slides) {
                    const slide = pptx.addSlide();
                    const state = slideData.canvasState ? JSON.parse(slideData.canvasState) : null;
                    if (!state) continue;

                    slide.background = { color: (state.backgroundColor || this.themeColors.surface).replace('#', '') };

                    const objectsToExport = state.objects || [];
                    
                    for (const obj of objectsToExport) {
                        const options = {
                            x: PxToInX(obj.left), y: PxToInY(obj.top),
                            w: PxToInX(obj.width * (obj.scaleX || 1)), h: PxToInY(obj.height * (obj.scaleY || 1)),
                        };
                        
                        if (obj.type === 'textbox') {
                            const textOptions = {
                                ...options,
                                fontFace: obj.fontFamily,
                                fontSize: PxToPt(obj.fontSize),
                                color: (obj.fill || this.themeColors.text).replace('#', ''),
                                bold: obj.fontWeight === 'bold',
                                italic: obj.fontStyle === 'italic',
                                underline: obj.underline,
                                align: obj.textAlign || 'left',
                                lineSpacing: PxToPt((obj.lineHeight || 1.16) * obj.fontSize)
                            };
                             if (obj.strokeWidth > 0) {
                                textOptions.outline = {
                                    size: PxToPt(obj.strokeWidth),
                                    color: (obj.stroke || this.themeColors.text).replace('#', '')
                                };
                            }
                            slide.addText(obj.text, textOptions);
                        } else if (obj.type === 'rect') {
                             slide.addShape(pptx.shapes.RECTANGLE, {...options, fill: {color: (obj.fill || this.themeColors.accent).replace('#','')}});
                        } else if (obj.type === 'circle') {
                             slide.addShape(pptx.shapes.OVAL, {...options, fill: {color: (obj.fill || this.themeColors.secondary).replace('#','')}});
                        } else if (obj.type === 'triangle') {
                             slide.addShape(pptx.shapes.ISOSCELES_TRIANGLE, {...options, fill: {color: (obj.fill || this.themeColors.primary).replace('#','')}});
                        } else if (obj.type === 'line') {
                             slide.addShape(pptx.shapes.LINE, {
                                 x: PxToInX(obj.left), y: PxToInY(obj.top),
                                 w: PxToInX(obj.width * (obj.scaleX || 1)), h: 0,
                                 line: { color: (obj.stroke || this.themeColors.text).replace('#',''), width: PxToPt(obj.strokeWidth) }
                             });
                        } else if (obj.type === 'image' && obj.src) {
                            slide.addImage({ data: obj.src, ...options });
                        }
                    }

                    if (this.globalFooter) {
                         slide.addText(this.globalFooter, {
                            x: 0, y: 5.2, w: '100%', h: 0.3, align: 'center',
                            fontFace: 'Outfit', fontSize: 10, color: '888888'
                        });
                    }
                }
                await pptx.writeFile({ fileName: 'SlidePuppy-Designed.pptx' });
                this.showNotification('success', 'PPTX exported successfully!');
            }
            
            saveWork() {
                this.saveCurrentSlideState();
                localStorage.setItem('presentationData', JSON.stringify(this.slides));
                localStorage.setItem('slidePuppyGlobalFooter', this.globalFooter);
                this.showNotification('success', 'Your work has been saved locally!');
            }

                        </div></div>
                    ${this.renderLayerControls()}
                    ${this.renderObjectActions()}
                </div>`;
            }

            renderShapeProperties(obj) {
                const colorProp = obj.type === 'line' ? 'stroke' : 'fill';
                const colorValue = obj[colorProp] || this.themeColors.text;
                return `<div class="properties-section">
                    <h3 class="properties-title">Shape Properties</h3>
                    <div class="control-group"><label class="control-label">Color</label><div class="color-picker-wrapper"><input class="color-picker" type="color" id="shape-color" value="${colorValue}"></div></div>
                    ${this.renderLayerControls()}
                    ${this.renderObjectActions()}
                </div>`;
            }

            renderLayerControls() {
                 return `<div class="properties-section">
                    <h3 class="properties-title">Layer Order</h3>
                     <div class="layer-controls">
                        <button class="btn btn--outline btn--small" id="bring-forward">Forward</button>
                        <button class="btn btn--outline btn--small" id="send-backward">Backward</button>
                        <button class="btn btn--outline btn--small" id="bring-to-front">To Front</button>
                        <button class="btn btn--outline btn--small" id="send-to-back">To Back</button>
                    </div>
                 </div>`;
            }
            
            renderObjectActions() {
                return `<div class="properties-section">
                    <h3 class="properties-title">Actions</h3>
                    <button class="btn btn--outline" id="duplicate-object" style="width: 100%; margin-bottom: 8px;">Duplicate</button>
                    <button class="btn btn--outline" id="delete-object" style="width: 100%;">Delete</button>
                </div>`;
            }

            setupPropertiesEvents() {
                 document.getElementById('background-color')?.addEventListener('input', (e) => this.updateBackgroundColor(e.target.value));
                 // Text
                document.getElementById('font-family-select')?.addEventListener('change', e => this.updateActiveObject('fontFamily', e.target.value));
                document.getElementById('font-size')?.addEventListener('input', e => this.updateActiveObject('fontSize', parseInt(e.target.value, 10)));
                document.getElementById('line-height')?.addEventListener('input', e => this.updateActiveObject('lineHeight', parseFloat(e.target.value)));
                document.getElementById('text-color')?.addEventListener('input', e => this.updateActiveObject('fill', e.target.value));
                document.getElementById('text-stroke-color')?.addEventListener('input', e => this.updateActiveObject('stroke', e.target.value));
                document.getElementById('text-stroke-width')?.addEventListener('input', e => this.updateActiveObject('strokeWidth', parseInt(e.target.value, 10)));
                
                document.getElementById('toggle-italic')?.addEventListener('click', () => this.toggleTextStyle('fontStyle', 'italic', 'normal'));
                document.getElementById('toggle-underline')?.addEventListener('click', () => this.toggleTextStyle('underline', true, false));
                
                document.getElementById('align-left')?.addEventListener('click', () => this.updateActiveObject('textAlign', 'left'));
                document.getElementById('align-center')?.addEventListener('click', () => this.updateActiveObject('textAlign', 'center'));
                document.getElementById('align-right')?.addEventListener('click', () => this.updateActiveObject('textAlign', 'right'));
                document.getElementById('toggle-bullets')?.addEventListener('click', () => this.toggleBulletPoints());

                 // Shape
                const shapeColorInput = document.getElementById('shape-color');
                if (shapeColorInput) {
                    shapeColorInput.addEventListener('input', e => {
                        const obj = this.canvas.getActiveObject();
                        if (obj) {
                            const prop = obj.type === 'line' ? 'stroke' : 'fill';
                            this.updateActiveObject(prop, e.target.value);
                        }
                    });
                }
                // Actions
                document.getElementById('duplicate-object')?.addEventListener('click', () => this.duplicateObject());
                document.getElementById('delete-object')?.addEventListener('click', () => this.deleteActiveObject());
                // Layers
                document.getElementById('bring-forward')?.addEventListener('click', () => this.bringForward());
                document.getElementById('send-backward')?.addEventListener('click', () => this.sendBackward());
                document.getElementById('bring-to-front')?.addEventListener('click', () => this.bringToFront());
                document.getElementById('send-to-back')?.addEventListener('click', () => this.sendToBack());
            }

            // --- Text Formatting ---
            toggleTextStyle(prop, activeValue, inactiveValue) {
                const obj = this.canvas.getActiveObject();
                if (obj) {
                    const isStyleActive = obj.get(prop) === activeValue;
                    obj.set(prop, isStyleActive ? inactiveValue : activeValue);
                    this.canvas.renderAll();
                    this.saveState();
                    this.updatePropertiesPanel();
                }
            }

            toggleBulletPoints() {
                const activeObject = this.canvas.getActiveObject();
                if (!activeObject || activeObject.type !== 'textbox') return;

                const lines = activeObject.text.split('\n');
                const areBulletsActive = lines.every(line => line.trim().startsWith('• '));

                const newLines = lines.map(line => {
                    if (areBulletsActive) {
                        return line.replace(/^•\s*/, '');
                    } else {
                        return line.trim() ? `• ${line}` : line;
                    }
                });

                activeObject.set('text', newLines.join('\n'));
                this.canvas.renderAll();
                this.saveState();
            }

            updateActiveObject(prop, value) {
                const obj = this.canvas.getActiveObject();
                if (obj) {
                    obj.set(prop, value);
                    this.canvas.renderAll();
                    this.saveState();
                }
            }
            
            // --- Layer Management ---
            bringForward() {
                const obj = this.canvas.getActiveObject();
                if (obj && !obj.isFooter) { this.canvas.bringForward(obj); this.saveState(); this.canvas.renderAll(); }
            }
            sendBackward() {
                const obj = this.canvas.getActiveObject();
                if (obj && !obj.isFooter) { this.canvas.sendBackwards(obj); this.saveState(); this.canvas.renderAll(); }
            }
            bringToFront() {
                const obj = this.canvas.getActiveObject();
                if (obj && !obj.isFooter) { this.canvas.bringToFront(obj); this.saveState(); this.canvas.renderAll(); }
            }
            sendToBack() {
                const obj = this.canvas.getActiveObject();
                if (obj && !obj.isFooter) { this.canvas.sendToBack(obj); this.saveState(); this.canvas.renderAll(); }
            }

            // --- Keyboard & Object Actions ---
            handleKeyboard(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                const key = e.key.toLowerCase();
                const isCtrl = e.ctrlKey || e.metaKey;

                if (isCtrl && key === 'z') { e.preventDefault(); this.undo(); }
                if (isCtrl && key === 'y') { e.preventDefault(); this.redo(); }
                if (isCtrl && key === 's') { e.preventDefault(); this.saveWork(); }
                if (isCtrl && key === 'c') { e.preventDefault(); this.copyObject(); }
                if (isCtrl && key === 'v') { e.preventDefault(); this.pasteObject(); }
                if (isCtrl && key === 'd') { e.preventDefault(); this.duplicateObject(); }

                if (key === 'delete' || key === 'backspace') {
                    const activeObject = this.canvas.getActiveObject();
                    if (activeObject && !activeObject.isEditing) {
                        e.preventDefault();
                        this.deleteActiveObject();
                    }
                }
            }
            
            deleteActiveObject() {
                const activeObjects = this.canvas.getActiveObjects();
                if (activeObjects.length) {
                    activeObjects.forEach(obj => {
                        if (!obj.isFooter) this.canvas.remove(obj);
                    });
                    this.canvas.discardActiveObject().renderAll();
                    this.saveState();
                }
            }
            
            duplicateObject() {
                const obj = this.canvas.getActiveObject();
                if (obj && !obj.isFooter) {
                    obj.clone(cloned => {
                        cloned.set({ left: obj.left + 10, top: obj.top + 10 });
                        this.canvas.add(cloned).setActiveObject(cloned).renderAll();
                        this.saveState();
                    });
                }
            }

            copyObject() {
                const activeObject = this.canvas.getActiveObject();
                if (activeObject && !activeObject.isFooter) {
                    activeObject.clone(cloned => this.clipboard = cloned);
                    this.showNotification('info', 'Object copied.');
                }
            }

            pasteObject() {
                if (!this.clipboard) return;
                this.clipboard.clone(cloned => {
                    cloned.set({ left: this.clipboard.left + 20, top: this.clipboard.top + 20 });
                    this.canvas.add(cloned).setActiveObject(cloned).renderAll();
                    this.saveState();
                });
            }
            
            // --- IMAGE SEARCH ---
            setupImageSearchEventListeners() {
                document.getElementById('modal-close-btn').addEventListener('click', () => this.closeImageSearchModal());
                document.getElementById('image-search-btn').addEventListener('click', () => this.handleImageSearch());
                document.getElementById('image-search-assisted-btn').addEventListener('click', () => this.handleImageSearch(true));
                this.imageSearch.loadMoreBtn.addEventListener('click', () => this.handleImageLoadMore());

                document.querySelectorAll('.search-type-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.search-type-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.imageSearch.searchType = btn.dataset.searchType;
                        const placeholderText = this.imageSearch.searchType === 'image' 
                            ? 'e.g., business meeting on a spaceship' 
                            : 'e.g., brain icon OR business vector';
                        this.imageSearch.queryInput.placeholder = placeholderText;
                    });
                });
            }

            openImageSearchModal() {
                this.imageSearch.modal.style.display = 'flex';
            }

            closeImageSearchModal() {
                this.imageSearch.modal.style.display = 'none';
            }
            
            resetImageSearchModal() {
                this.imageSearch.resultsContainer.innerHTML = '';
                this.imageSearch.resultsContainer.appendChild(this.imageSearch.placeholder);
                this.imageSearch.placeholder.style.display = 'block';
                this.imageSearch.loadMoreContainer.style.display = 'none';
                this.imageSearch.queryInput.value = '';
                this.imageSearch.currentPage = 1;
                this.imageSearch.currentQuery = '';
                this.imageSearch.currentLicense = '';
            }

            getSlideContentAsText() {
                return this.canvas.getObjects()
                    .filter(obj => obj.type === 'textbox' && !obj.isFooter)
                    .map(obj => obj.text)
                    .join(' ');
            }
            
            async handleImageSearch(isAssisted = false) {
                let query = this.imageSearch.queryInput.value.trim();
                const license = this.imageSearch.licenseFilter.value;

                if (this.imageSearch.searchType === 'vector' && !isAssisted) {
                    query += " vector icon filetype:svg";
                }

                if (isAssisted) {
                    const slideText = this.getSlideContentAsText();
                    if (!slideText) {
                        this.showNotification('error', 'Current slide has no text for AI to analyze.');
                        return;
                    }
                    if (!this.geminiApiKey) {
                        this.showNotification('error', 'Please provide a Gemini API Key for AI assistance.');
                        return;
                    }
                    this.showNotification('info', 'AI is generating a search query...');
                    this.imageSearch.loader.style.display = 'flex';
                    try {
                        query = await this.getAiSearchQueries(slideText, this.imageSearch.searchType);
                        
                        if (this.imageSearch.searchType === 'vector') {
                            query += " filetype:svg";
                        }

                        this.showNotification('success', `AI searching for: "${query}"`);
                        this.imageSearch.queryInput.value = query;
                    } catch (e) {
                        this.showNotification('error', `AI failed: ${e.message}`);
                        this.imageSearch.loader.style.display = 'none';
                        return;
                    }
                }

                if (!query) {
                    this.showNotification('error', 'Please enter a search query.');
                    return;
                }
                if (!this.googleSearchKey || !this.googleEngineId) {
                    this.showNotification('error', 'Please provide Google Search API Key and Engine ID in the AI Tools tab.');
                    return;
                }
                
                this.imageSearch.currentPage = 1;
                this.imageSearch.currentQuery = query;
                this.imageSearch.currentLicense = license;

                this.imageSearch.resultsContainer.innerHTML = '';
                if(this.imageSearch.placeholder) this.imageSearch.placeholder.style.display = 'none';
                this.imageSearch.loadMoreContainer.style.display = 'none';
                this.imageSearch.loader.style.display = 'flex';

                try {
                    const items = await this.performImageSearch(query, license);
                    this.displayImageResults(items);
                    if (items && items.length === 10) {
                        this.imageSearch.loadMoreContainer.style.display = 'block';
                    }
                } catch(e) {
                     this.showNotification('error', `Search failed: ${e.message}`);
                     this.imageSearch.resultsContainer.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--color-error);">${e.message}</p>`;
                } finally {
                    this.imageSearch.loader.style.display = 'none';
                }
            }

            async handleImageLoadMore() {
                this.imageSearch.currentPage++;
                const startIndex = (this.imageSearch.currentPage - 1) * 10 + 1;
                this.imageSearch.loadMoreBtn.textContent = 'Loading...';
                this.imageSearch.loadMoreBtn.disabled = true;

                try {
                    const items = await this.performImageSearch(this.imageSearch.currentQuery, this.imageSearch.currentLicense, startIndex);
                    this.displayImageResults(items, true);
                    if (!items || items.length < 10) {
                        this.imageSearch.loadMoreContainer.style.display = 'none';
                        this.showNotification('info', 'No more images found.');
                    }
                } catch (e) {
                     this.showNotification('error', `Failed to load more: ${e.message}`);
                } finally {
                    this.imageSearch.loadMoreBtn.textContent = 'Load More';
                    this.imageSearch.loadMoreBtn.disabled = false;
                }
            }

            async getAiSearchQueries(slideText, searchType = 'image') {
                let systemPrompt = '';
                if (searchType === 'vector') {
                    systemPrompt = `You are an expert keyword extractor for finding SVG icons and vector graphics. Analyze the following slide content and generate a single, concise, and effective keyword string for a Google Image search for a vector graphic. Focus on concepts and objects. Return ONLY this keyword string. Do not add explanations. For example, if the content is 'Our Q3 earnings show a 20% growth in the European market', you might return 'growth icon arrow up infographic'.`;
                } else {
                    systemPrompt = `You are an expert keyword extractor for a search engine. Your task is to analyze the following slide content and generate a single, concise, and effective keyword string for a Google Image search. Return ONLY this keyword string. Do not add any explanations or introductory text. For example, if the content is 'Our Q3 earnings show a 20% growth in the European market', you might return 'business growth chart Europe'.`;
                }

                const fullPrompt = `${systemPrompt} Slide content: "${slideText}"`;
                const response = await this.callGeminiAPI(fullPrompt);
                return response.trim().replace(/"/g, '');
            }

            async performImageSearch(query, license, startIndex = 1) {
                let url = `https://www.googleapis.com/customsearch/v1?key=${this.googleSearchKey}&cx=${this.googleEngineId}&q=${encodeURIComponent(query)}&searchType=image&num=10&start=${startIndex}`;
                if (license) { url += `&rights=${license}`; }
                const response = await fetch(url);
                if (!response.ok) { const error = await response.json(); throw new Error(error.error.message || 'Failed to fetch images.'); }
                const data = await response.json();
                return data.items;
            }

            displayImageResults(items, append = false) {
                const resultsContainer = this.imageSearch.resultsContainer;
                if (!append) resultsContainer.innerHTML = '';
                if (!items || items.length === 0) {
                    if (!append) {
                        resultsContainer.innerHTML = '';
                        resultsContainer.appendChild(this.imageSearch.placeholder);
                        this.imageSearch.placeholder.style.display = 'block';
                        this.imageSearch.placeholder.textContent = 'No images found.';
                    }
                    return;
                }
                
                if (this.imageSearch.placeholder) this.imageSearch.placeholder.style.display = 'none';

                items.forEach(item => {
                    if (!item.link) return;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'image-search-item';

                    const img = document.createElement('img');
                    img.src = item.link;
                    img.alt = item.title;
                    img.onerror = () => { img.src = `https://placehold.co/300x300/e2e8f0/94a3b8?text=Error`; };

                    const overlay = document.createElement('div');
                    overlay.className = 'overlay';

                    const insertBtn = document.createElement('button');
                    insertBtn.textContent = 'Insert';
                    insertBtn.className = 'btn btn--primary btn--small';
                    insertBtn.onclick = () => {
                        if (this.imageSearch.searchType === 'image') {
                            this.insertImageFromUrl(item.link);
                        } else {
                            this.insertSvgFromUrl(item.link);
                        }
                        this.showNotification('success', `${this.imageSearch.searchType === 'image' ? 'Image' : 'Vector'} added to slide!`);
                    };
                    
                    const downloadBtn = document.createElement('a');
                    downloadBtn.textContent = 'Download';
                    downloadBtn.className = 'btn btn--outline btn--small';
                    downloadBtn.href = item.link;
                    downloadBtn.download = item.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                    downloadBtn.target = '_blank';

                    overlay.appendChild(insertBtn);
                    overlay.appendChild(downloadBtn);
                    itemDiv.appendChild(img);
                    itemDiv.appendChild(overlay);
                    resultsContainer.appendChild(itemDiv);
                });
            }

            // --- Math Modal ---
            setupMathModalEventListeners() {
                const MQ = MathQuill.getInterface(2);
                this.mathModal.closeBtn.addEventListener('click', () => this.closeMathModal());
                this.mathModal.insertBtn.addEventListener('click', () => this.insertMathEquation());
                
                const mathFieldSpan = this.mathModal.editorSpan;
                const latexOutput = this.mathModal.latexOutput;
                this.mathModal.mathField = MQ.MathField(mathFieldSpan, {
                    spaceBehavesLikeTab: true,
                    handlers: {
                        edit: () => {
                            latexOutput.value = this.mathModal.mathField.latex();
                        }
                    }
                });
            }

            openMathModal() {
                this.mathModal.element.style.display = 'flex';
                this.mathModal.mathField.focus();
            }

            closeMathModal() {
                this.mathModal.element.style.display = 'none';
            }

            insertMathEquation() {
                const latex = this.mathModal.mathField.latex();
                if (latex.trim() === '') {
                    this.showNotification('error', 'Math field is empty.');
                    return;
                }
                const encodedLatex = encodeURIComponent(latex);
                const imageUrl = `https://latex.codecogs.com/png.latex?%5Cdpi%7B300%7D%20%5Chuge%20%5Ccolor%7Bblack%7D%20${encodedLatex}`;
                
                this.insertImageFromUrl(imageUrl);
                this.showNotification('success', 'Equation inserted as image.');
                this.closeMathModal();
            }

            // --- Helpers ---
            rgbaToHex(rgba) {
                if (!rgba || !rgba.startsWith('rgba')) return rgba;
                const parts = rgba.substring(rgba.indexOf("(")).split(",");
                const r = parseInt(parts[0].substring(1).trim(), 10);
                const g = parseInt(parts[1].trim(), 10);
                const b = parseInt(parts[2].trim(), 10);
                return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
            }

            sanitizeAIObjects(objects) {
                if (!Array.isArray(objects)) return;
                objects.forEach(obj => {
                    if (obj.fill && typeof obj.fill === 'string' && obj.fill.startsWith('rgba')) {
                        obj.fill = this.rgbaToHex(obj.fill);
                    }
                     if (obj.fill === null) {
                        obj.fill = this.themeColors.text;
                    }
                    if (obj.stroke && typeof obj.stroke === 'string' && obj.stroke.startsWith('rgba')) {
                        obj.stroke = this.rgbaToHex(obj.stroke);
                    }
                     if (obj.stroke === null) {
                        obj.stroke = this.themeColors.text;
                    }
                });
            }

            async callGeminiAPI(prompt) {
                console.log("Sending prompt to AI:", prompt);
                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${this.geminiApiKey}`;
                
                let lastError;
                for (let i = 0; i < 3; i++) {
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                        });

                        if (response.ok) {
                            const result = await response.json();
                             if (!result.candidates || !result.candidates[0].content.parts[0].text) {
                                throw new Error("API returned an empty or invalid response.");
                            }
                            const responseText = result.candidates[0].content.parts[0].text;
                            console.log("Received AI response:", responseText);
                            return responseText;
                        } else if (response.status === 503 || response.status === 429) {
                            lastError = new Error(`API Error: ${response.statusText} (retrying...)`);
                            console.warn(lastError);
                            await new Promise(resolve => setTimeout(resolve, 1000 * Math.pow(2, i)));
                        } else {
                            const error = await response.json();
                            throw new Error(`API Error: ${error.error?.message || 'Unknown API Error'}`);
                        }
                    } catch (error) {
                        lastError = error;
                    }
                }
                throw lastError;
            }

            parseJsonResponse(text) {
                try {
                    const match = text.match(/```json\s*([\s\S]*?)\s*```/);
                    let jsonString = match ? match[1] : text;
                    jsonString = jsonString.replace(/\/\/.*/g, '');
                    return JSON.parse(jsonString);
                } catch (e) {
                    console.error("JSON Parse Error:", e, "Raw Text:", text);
                    throw new Error("AI returned an invalid data format.");
                }
            }

            showNotification(type, message) {
                document.querySelectorAll('.notification').forEach(n => n.remove());
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.textContent = message;
                document.body.appendChild(notification);
                setTimeout(() => notification.remove(), 3000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new PresentationDesigner();
        });
    </script>
</body>
